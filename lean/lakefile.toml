name = "funk"
version = "0.1.0"
defaultTargets = ["Funk", "FinalTheorems"]

[[lean_lib]]
name = "Funk"

[[lean_lib]]
name = "OAI"
srcDir = "vendor/oai-mass"
weakLeanArgs = ["-j1"]

[[lean_lib]]
name = "FormalConjecturesUtil"
srcDir = "vendor/formal-conjectures"
globs = ["FormalConjecturesUtil.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "KalaiFullFlags"
srcDir = "../FClikelean"
[lean_lib.leanOptions]
warn.sorry = false

[[lean_lib]]
name = "SymmetricFunkVolume"
srcDir = "../FClikelean"
[lean_lib.leanOptions]
warn.sorry = false

[[lean_lib]]
name = "FinalTheorems"
